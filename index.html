<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Ruta - Granada Nicaragua</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #f0f2f5;
            width: 100%;
            overflow: hidden;
            color: #1a1a2e;
        }

        #sidebar {
            width: min(380px, 34vw);
            min-width: 320px;
            max-width: 420px;
            background: #fff;
            padding: clamp(16px, 2vw, 24px);
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 11px;
            height: 100vh;
            z-index: 1010;
            transition: transform 0.3s cubic-bezier(.4,0,.2,1), box-shadow 0.3s ease;
            overscroll-behavior: contain;
        }

        #map {
            flex: 1;
            height: 100vh;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0e6e8;
        }

        .logo-container img {
            max-width: min(200px, 70%);
            height: auto;
        }

        .search-box {
            position: relative;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .search-row input {
            flex: 1;
            min-width: 0;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 11px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fafafa;
            transition: border-color 0.2s, background 0.2s;
        }
        input::placeholder { color: #aaa; }

        input:focus {
            border-color: #8B1A2B;
            background: #fff;
            outline: none;
        }

        .btn {
            padding: 12px 14px;
            min-height: 46px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            font-size: 14px;
            transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
            width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.2px;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }

        .btn-location {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            color: #fff;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(25,118,210,0.25);
        }

        .btn-location:hover {
            background: #1565c0;
        }

        .btn-search {
            background: #8B1A2B;
            color: #fff;
            white-space: nowrap;
            width: auto;
            padding: 12px 16px;
        }

        .btn-search:hover:not(:disabled) {
            background: #6B1521;
        }

        .btn-primary {
            background: #333;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a1a1a;
        }

        .btn-warning {
            background: #8B1A2B;
            color: #fff;
        }

        .btn-warning:hover:not(:disabled) {
            background: #6B1521;
        }

        .btn-danger {
            background: #555;
            color: #fff;
        }

        .btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }

        .status {
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 13px;
            text-align: center;
            background: #f5f5f7;
            color: #444;
            font-weight: 600;
            line-height: 1.4;
        }

        .status.error {
            background: #fff0f0;
            color: #b71c1c;
            border-left: 3px solid #ef5350;
        }

        .status.success {
            background: #f0faf2;
            color: #1b5e20;
            border-left: 3px solid #43a047;
        }

        .status.info {
            background: #e8f4fd;
            color: #0d47a1;
            border-left: 3px solid #42a5f5;
        }

        .options-list {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .option-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            border-bottom: 1px solid #e0e0e0;
        }

        .option-item:last-child {
            border-bottom: none;
        }

        .option-item:hover,
        .option-item.active {
            background: #f0e6e8;
            font-weight: 600;
        }

        .destinos-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .destinos-list li {
            padding: 10px;
            background: #fafafa;
            margin-bottom: 6px;
            border-radius: 6px;
            border-left: 4px solid #8B1A2B;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .destinos-list li .numero {
            font-weight: bold;
            color: #8B1A2B;
            margin-right: 6px;
        }

        .delete-btn {
            background: #ef5350;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            min-height: 36px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            color: #8B1A2B;
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 14px;
            margin-bottom: 15px;
            color: #555;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-accept {
            background: #8B1A2B;
            color: #fff;
        }

        .btn-cancel {
            background: #757575;
            color: #fff;
        }

        .badge-granada {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.96);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            color: #8B1A2B;
            border: 2px solid #8B1A2B;
            max-width: calc(100% - 24px);
        }

        .tabs-rutas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .tab-card {
            background: #f9f9f9;
            padding: 15px 6px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-card.active {
            border-color: #8B1A2B;
            background: #f0e6e8;
        }

        .tab-card .icon {
            font-size: 1.6rem;
        }

        .ruta-resultado {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .ruta-resultado.visible {
            display: block;
        }

        .ruta-titulo {
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .orden-visita {
            list-style: none;
            margin-bottom: 12px;
        }

        .orden-visita li {
            padding: 8px 10px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #8B1A2B 0%, #6B1521 100%);
            color: white;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .orden-visita li.inicio {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
        }

        .orden-visita li .numero {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .orden-visita li div {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .orden-visita li strong,
        .orden-visita li small {
            overflow-wrap: anywhere;
        }

        /* BOTONES FLOTANTES RESPONSIVE */
        #btnToggleView,
        #btnOpenMap {
            display: none;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            color: white;
            padding: 14px 22px;
            border-radius: 999px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            border: none;
            cursor: pointer;
            font-size: 15px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        #btnToggleView {
            bottom: calc(18px + env(safe-area-inset-bottom));
            background: linear-gradient(135deg, #8B1A2B, #6B1521);
            box-shadow: 0 6px 20px rgba(139,26,43,0.4);
        }

        #btnOpenMap {
            bottom: calc(74px + env(safe-area-inset-bottom));
            background: linear-gradient(135deg, #1976d2, #1565c0);
            box-shadow: 0 6px 20px rgba(25,118,210,0.4);
        }

        .leaflet-control-zoom a {
            width: 38px;
            height: 38px;
            line-height: 38px;
        }

        @media (max-width: 1024px) {
            #sidebar {
                width: min(360px, 42vw);
                min-width: 300px;
            }

            .search-row {
                flex-wrap: wrap;
            }

            .btn-search {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                position: relative;
            }

            #sidebar {
                position: absolute;
                inset: 0 auto 0 0;
                width: min(100%, 100vw);
                min-width: 100%;
                max-width: 100%;
                height: 100dvh;
                border-right: none;
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
                padding: 16px 16px 96px;
            }

            #map {
                width: 100vw;
                height: 100dvh;
                position: absolute;
                top: 0;
                left: 0;
            }

            .search-row {
                flex-direction: column;
            }

            .tabs-rutas {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .destinos-list li {
                align-items: flex-start;
                gap: 10px;
            }

            .badge-granada {
                top: 12px;
                left: 12px;
                right: auto;
                font-size: 11px;
            }

            body.ver-mapa #sidebar {
                transform: translateX(-100%);
                box-shadow: none;
            }

            body.ver-mapa #btnToggleView {
                display: flex;
            }

            body:not(.ver-mapa) #btnOpenMap {
                display: flex;
            }

            body:not(.ver-mapa) #btnToggleView {
                display: none;
            }

            .leaflet-top.leaflet-right {
                top: 60px !important;
            }
        }

        @media (max-width: 480px) {
            #sidebar {
                padding: 14px 14px 104px;
                gap: 12px;
            }

            .logo-container h2 {
                font-size: 1.2rem !important;
            }

            .tabs-rutas {
                gap: 8px;
            }

            .tab-card {
                padding: 12px 6px;
            }

            .tab-card .icon {
                font-size: 1.4rem;
            }

            .modal {
                width: calc(100% - 24px);
                padding: 20px;
            }

            .modal-btns {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="logo-container">
            <img src="logo.jpeg" alt="Eco Ruta Granada" onerror="this.style.display='none'">
            <h2 style="color: #8B1A2B; font-size: 1.4rem;">Eco Ruta Granada</h2>
        </div>

        <button class="btn btn-location" onclick="obtenerUbicacionActual()">
            📍 MI UBICACIÓN ACTUAL
        </button>

        <div class="search-box">
            <div class="search-row">
                <input type="text" id="inputLugar" placeholder="Ej: Farmacia, Supermercado...">
                <button type="button" id="btnBuscar" class="btn btn-search" onclick="buscarLugar()">🔍 Buscar</button>
            </div>
        </div>

        <div id="statusMsg" class="status">💡 Escribe un lugar o usa tu GPS</div>

        <button id="btnAgregar" class="btn btn-primary" onclick="agregarDestino()" disabled>✅ Agregar Destino</button>

        <h3 style="font-size:16px; color:#333;">📋 Destinos (<span id="contador">0</span>)</h3>
        <ul id="listaDestinos" class="destinos-list"></ul>

        <button id="btnOptimizar" class="btn btn-warning" onclick="optimizarYMostrar()" disabled>
            🚀 CALCULAR ALTERNATIVAS DE RUTA
        </button>

        <div class="ruta-resultado" id="rutaResultado">
            <div class="ruta-titulo">Opciones de viaje disponibles:</div>

            <div class="tabs-rutas">
                <div class="tab-card" id="tab-foot" onclick="seleccionarVistaRuta('foot')">
                    <div class="icon">🚶</div>
                </div>
                <div class="tab-card" id="tab-bike" onclick="seleccionarVistaRuta('bike')">
                    <div class="icon">🚲</div>
                </div>
                <div class="tab-card" id="tab-car" onclick="seleccionarVistaRuta('car')">
                    <div class="icon">🚗</div>
                </div>
            </div>

            <div class="ruta-titulo" style="margin-top:15px;">📍 Orden de visita sugerido:</div>
            <ol class="orden-visita" id="ordenVisita"></ol>
        </div>

        <button class="btn btn-danger" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
    </div>

    <div id="map">
        <div class="badge-granada">📍 Eco Ruta Granada</div>
    </div>

    <button id="btnOpenMap" type="button" onclick="mostrarMapaMovil()">🗺️ Ver mapa</button>
    <button id="btnToggleView" type="button" onclick="alternarVistaMovil()">📋 Ver Lista de Destinos</button>

    <div id="modalSugerencia" class="modal-overlay">
        <div class="modal">
            <h3>💡 Sucursal Más Cercana Detectada</h3>
            <p id="textoSugerencia"></p>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="rechazarSugerencia()">Ver otras opciones</button>
                <button class="btn-accept" onclick="aceptarSugerencia()">✅ Usar esta sucursal</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const GRANADA_BOUNDS = [[11.87, -86.03], [11.99, -85.89]];
        let destinos = [];
        let tempSeleccion = null;
        let marcadoresMapa = [];
        let rutaLinea = null;
        let miUbicacion = null;
        let marcadoresPuntosMedios = [];

        window.rutasCalculadas = { foot: null, bike: null, car: null };
        let vistaActual = 'foot';

        const map = L.map('map', {
            center: [11.9280, -85.9580],
            zoom: 16,
            minZoom: 13,
            maxZoom: 19,
            maxBounds: GRANADA_BOUNDS,
            maxBoundsViscosity: 1.0,
            zoomControl: false
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        document.addEventListener('DOMContentLoaded', () => {
            configurarVistaResponsive();
            obtenerUbicacionActual();
            setTimeout(() => { map.invalidateSize(); }, 250);
        });

        window.addEventListener('resize', () => {
            configurarVistaResponsive();
            map.invalidateSize();
        });

        function esMovil() {
            return window.innerWidth <= 768;
        }

        function configurarVistaResponsive() {
            if (!esMovil()) {
                document.body.classList.remove('ver-mapa');
            }
        }

        function mostrarMapaMovil() {
            if (!esMovil()) return;
            document.body.classList.add('ver-mapa');
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // Función para cambiar de vista en teléfonos de forma fluida
        function alternarVistaMovil() {
            document.body.classList.remove('ver-mapa');
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        let _watchId = null;

        function obtenerUbicacionActual() {
            if (!navigator.geolocation) {
                mostrarEstado('❌ Tu navegador no soporta GPS', 'error');
                miUbicacion = { lat: 11.9280, lon: -85.9580 };
                return;
            }

            // Limpiar watcher anterior si existe
            if (_watchId !== null) {
                navigator.geolocation.clearWatch(_watchId);
                _watchId = null;
            }

            mostrarEstado('📡 Buscando tu ubicación GPS...', 'info');

            // Icono de usuario
            const crearIconoUsuario = () => L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#1976d2;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px rgba(0,0,0,0.4);'></div>",
                iconSize: [20, 20], iconAnchor: [10, 10]
            });

            const colocarMarcador = (lat, lon) => {
                if (window.miMarker) map.removeLayer(window.miMarker);
                window.miMarker = L.marker([lat, lon], { icon: crearIconoUsuario() })
                    .addTo(map)
                    .bindPopup('<b>📍 Estás aquí</b>');
            };

            let ubicacionYaEncontrada = false;

            const exito = (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const precision = position.coords.accuracy;

                miUbicacion = { lat, lon };
                colocarMarcador(lat, lon);

                const latOk = lat >= GRANADA_BOUNDS[0][0] && lat <= GRANADA_BOUNDS[1][0];
                const lonOk = lon >= GRANADA_BOUNDS[0][1] && lon <= GRANADA_BOUNDS[1][1];

                if (!latOk || !lonOk) {
                    mostrarEstado('⚠️ Estás fuera de Granada. Mapa centrado en el parque central.', 'info');
                    map.setView([11.9280, -85.9580], 16);
                } else {
                    const precisionTxt = precision < 30 ? '🎯 Alta precisión' : precision < 100 ? '📍 Precisión media' : '📡 Precisión baja';
                    mostrarEstado(`✅ Ubicación encontrada. ${precisionTxt}. Agrega tus destinos.`, 'success');
                    if (!ubicacionYaEncontrada) {
                        map.setView([lat, lon], 17);
                    }
                }

                ubicacionYaEncontrada = true;
                map.invalidateSize();
            };

            const fallo = (error) => {
                console.warn("GPS error:", error.code, error.message);
                let msg = '❌ No se pudo obtener tu ubicación.';

                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        msg = '❌ Permiso denegado. Ve a Ajustes → Navegador → Ubicación y actívala.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        msg = '❌ GPS no disponible. Enciende el GPS en los ajustes de tu celular.';
                        // Intentar de nuevo sin alta precisión
                        if (!ubicacionYaEncontrada) {
                            setTimeout(() => {
                                navigator.geolocation.getCurrentPosition(exito, falloFinal, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
                            }, 1500);
                            mostrarEstado('📡 GPS no disponible. Intentando via red Wi-Fi...', 'info');
                            return;
                        }
                        break;
                    case error.TIMEOUT:
                        msg = '⏱️ Tiempo agotado. Asegúrate de tener buena señal o activa el GPS.';
                        if (!ubicacionYaEncontrada) {
                            setTimeout(() => {
                                navigator.geolocation.getCurrentPosition(exito, falloFinal, { enableHighAccuracy: false, timeout: 20000, maximumAge: 30000 });
                            }, 1000);
                            mostrarEstado('⏱️ Reintentando con menor precisión...', 'info');
                            return;
                        }
                        break;
                }

                if (!ubicacionYaEncontrada) falloFinal(error);
            };

            const falloFinal = (error) => {
                if (ubicacionYaEncontrada) return;
                console.error("GPS fallo final:", error);
                let msg = '❌ No se detectó tu ubicación. Usando centro de Granada.';
                if (error && error.code === 1) msg = '❌ Permiso denegado. Activa ubicación en Ajustes del navegador.';
                mostrarEstado(msg, 'error');
                miUbicacion = { lat: 11.9280, lon: -85.9580 };
                map.setView([11.9280, -85.9580], 16);
                map.invalidateSize();
            };

            // Primera llamada rápida con alta precisión
            navigator.geolocation.getCurrentPosition(exito, fallo, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });

            // watchPosition para actualizar la posición en tiempo real
            _watchId = navigator.geolocation.watchPosition(exito, () => {}, {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 5000
            });
        }

        async function buscarLugar() {
            const query = document.getElementById('inputLugar').value.trim();
            if (!query) return;
            mostrarEstado('🔍 Buscando en Granada...', 'info');
            document.getElementById('opcionesContainer')?.remove();
            tempSeleccion = null;
            document.getElementById('btnAgregar').disabled = true;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=-86.03,11.99,-85.89,11.87&bounded=1&limit=5&accept-language=es`;
                const res = await fetch(url, { headers: { 'User-Agent': 'EcoRutaApp/1.0' } });
                const data = await res.json();
                if (!data.length) { mostrarEstado('❌ No encontrado en Granada.', 'error'); return; }

                if (miUbicacion && data.length > 1) {
                    let masCercano = data[0];
                    let distMin = Infinity;
                    for (const r of data) {
                        const dist = haversine(miUbicacion.lat, miUbicacion.lon, parseFloat(r.lat), parseFloat(r.lon));
                        if (dist < distMin) { distMin = dist; masCercano = r; }
                    }
                    mostrarSugerencia(masCercano, data);
                } else {
                    procesarResultados(data);
                }
            } catch (e) { mostrarEstado('❌ Error de conexión al servidor.', 'error'); }
        }

        function mostrarSugerencia(masCercano, todos) {
            const modal = document.getElementById('modalSugerencia');
            const texto = document.getElementById('textoSugerencia');
            texto.innerHTML = `Detectamos que el punto más cercano a ti es: <strong>${masCercano.display_name.split(',')[0]}</strong> en <em>${masCercano.display_name.split(',').slice(0, 2).join(', ')}</em>.`;
            modal.classList.add('visible');
            window.todosResultados = todos;
            seleccionarUnico(masCercano);
        }

        function aceptarSugerencia() { document.getElementById('modalSugerencia').classList.remove('visible'); }

        function rechazarSugerencia() {
            document.getElementById('modalSugerencia').classList.remove('visible');
            if (window.todosResultados) procesarResultados(window.todosResultados);
        }

        function procesarResultados(resultados) {
            const container = document.createElement('div');
            container.id = 'opcionesContainer';
            container.className = 'options-list';
            if (resultados.length === 1) { seleccionarUnico(resultados[0]); }
            else {
                resultados.forEach((r, i) => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.textContent = `📍 ${r.display_name.split(',').slice(0, 2).join(',')}`;
                    div.onclick = () => seleccionarOpcion(i, resultados);
                    container.appendChild(div);
                });
                document.querySelector('.search-box').appendChild(container);
                mostrarEstado(`✅ Selecciona una opción de la lista:`, 'normal');
            }
        }

        function seleccionarOpcion(index, resultados) {
            document.querySelectorAll('.option-item').forEach((el, i) => el.classList.toggle('active', i === index));
            seleccionarUnico(resultados[index]);
        }

        function seleccionarUnico(resultado) {
            tempSeleccion = {
                nombre: resultado.display_name.split(',')[0],
                lat: parseFloat(resultado.lat),
                lon: parseFloat(resultado.lon)
            };
            map.setView([tempSeleccion.lat, tempSeleccion.lon], 17);
            if (window.tempMarker) map.removeLayer(window.tempMarker);
            window.tempMarker = L.marker([tempSeleccion.lat, tempSeleccion.lon]).addTo(map)
                .bindPopup(`<b>${tempSeleccion.nombre}</b>`).openPopup();
            document.getElementById('opcionesContainer')?.remove();
            document.getElementById('btnAgregar').disabled = false;
            mostrarEstado('✅ Destino listo para agregar.', 'success');

            // Mover al mapa en móvil para que el usuario vea dónde cayó el marcador asignado
            if (esMovil()) {
                mostrarMapaMovil();
            }
        }

        function agregarDestino() {
            if (!tempSeleccion) return;
            destinos.push({ ...tempSeleccion });
            const marker = L.marker([tempSeleccion.lat, tempSeleccion.lon]).addTo(map)
                .bindPopup(`<b>${destinos.length}. ${tempSeleccion.nombre}</b>`);
            marcadoresMapa.push(marker);

            if (window.tempMarker) { map.removeLayer(window.tempMarker); window.tempMarker = null; }

            removerRutaGrafica();
            renderLista();
            document.getElementById('inputLugar').value = '';
            tempSeleccion = null;
            document.getElementById('btnAgregar').disabled = true;
            mostrarEstado('➕ Añadido con éxito.', 'success');
            if (destinos.length >= 1) document.getElementById('btnOptimizar').disabled = false;

            // Al añadir el destino, regresar al formulario para que pueda seguir buscando más cosas
            if (esMovil()) {
                alternarVistaMovil();
            }
        }

        function renderLista() {
            const ul = document.getElementById('listaDestinos');
            ul.innerHTML = '';
            destinos.forEach((d, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span><span class="numero">${i + 1}</span>${d.nombre}</span> <button class="delete-btn" onclick="eliminarDestino(${i})">✕</button>`;
                ul.appendChild(li);
            });
            document.getElementById('contador').textContent = destinos.length;
            if (destinos.length < 1) document.getElementById('btnOptimizar').disabled = true;
        }

        function eliminarDestino(index) {
            if (marcadoresMapa[index]) map.removeLayer(marcadoresMapa[index]);
            destinos.splice(index, 1);
            marcadoresMapa.splice(index, 1);
            marcadoresMapa.forEach((m, i) => m.setPopupContent(`<b>${i + 1}. ${destinos[i].nombre}</b>`));
            removerRutaGrafica();
            renderLista();
            mostrarEstado('🗑️ Destino eliminado.', 'info');
        }

        function removerRutaGrafica() {
            document.getElementById('rutaResultado').classList.remove('visible');
            if (rutaLinea) { map.removeLayer(rutaLinea); rutaLinea = null; }
            marcadoresPuntosMedios.forEach(m => map.removeLayer(m));
            marcadoresPuntosMedios = [];
        }

        async function optimizarYMostrar() {
            if (!miUbicacion || destinos.length === 0) return;

            mostrarEstado('🔄 Trazando las 3 opciones de rutas...', 'info');
            document.getElementById('btnOptimizar').disabled = true;

            let rutaBase = [{ nombre: "Tu Ubicación Actual", lat: miUbicacion.lat, lon: miUbicacion.lon }, ...destinos];
            let rutaOrdenada = ordenarPorCercaniaTotal(rutaBase);

            const coordenadas = rutaOrdenada.map(p => `${p.lon},${p.lat}`).join(';');

            const peticiones = {
                foot: `https://router.project-osrm.org/route/v1/foot/${coordenadas}?overview=full&geometries=geojson`,
                bike: `https://router.project-osrm.org/route/v1/bicycle/${coordenadas}?overview=full&geometries=geojson`,
                car: `https://router.project-osrm.org/route/v1/driving/${coordenadas}?overview=full&geometries=geojson`
            };

            try {
                const [resFoot, resBike, resCar] = await Promise.all([
                    fetch(peticiones.foot).then(r => r.json()),
                    fetch(peticiones.bike).then(r => r.json()),
                    fetch(peticiones.car).then(r => r.json())
                ]);

                procesarResultadoMedio('foot', resFoot, rutaOrdenada);
                procesarResultadoMedio('bike', resBike, rutaOrdenada);
                procesarResultadoMedio('car', resCar, rutaOrdenada);

                document.getElementById('rutaResultado').classList.add('visible');
                seleccionarVistaRuta(vistaActual);
                mostrarEstado('🚀 ¡Tus rutas están listas!', 'success');

                // EN MÓVIL: Una vez calculada la ruta, mandar al usuario directo al mapa interactivo
                if (esMovil()) {
                    mostrarMapaMovil();
                }

            } catch (e) {
                mostrarEstado('⚠️ Error de conexión al servidor de mapas.', 'error');
                console.error(e);
            } finally {
                document.getElementById('btnOptimizar').disabled = false;
            }
        }

        function procesarResultadoMedio(perfil, data, rutaOrdenada) {
            if (data.code === 'Ok' && data.routes.length > 0) {
                const route = data.routes[0];
                window.rutasCalculadas[perfil] = {
                    distancia: route.distance / 1000,
                    tiempo: Math.round(route.duration / 60),
                    geometria: route.geometry.coordinates.map(c => [c[1], c[0]]),
                    puntos: rutaOrdenada.slice(1)
                };
            }
        }

        function seleccionarVistaRuta(perfil) {
            vistaActual = perfil;

            document.querySelectorAll('.tab-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${perfil}`).classList.add('active');

            const datos = window.rutasCalculadas[perfil];
            if (!datos) return;

            if (rutaLinea) map.removeLayer(rutaLinea);
            marcadoresPuntosMedios.forEach(m => map.removeLayer(m));
            marcadoresPuntosMedios = [];

            const colores = { foot: '#8B1A2B', bike: '#2e7d32', car: '#1976d2' };

            rutaLinea = L.polyline(datos.geometria, {
                color: colores[perfil],
                weight: 5,
                opacity: 0.85,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            map.fitBounds(rutaLinea.getBounds(), { padding: [50, 50] });

            const listaOrdenada = document.getElementById('ordenVisita');
            listaOrdenada.innerHTML = '<li class="inicio"><span class="numero">🏠</span><div><strong>Tu ubicación actual</strong><small>Punto de partida</small></div></li>';

            datos.puntos.forEach((destino, index) => {
                listaOrdenada.innerHTML += `<li style="background: ${colores[perfil]}">
                    <span class="numero">${index + 1}</span>
                    <div><strong>${destino.nombre}</strong><small>${index === 0 ? '🔥 ¡Tu parada más cercana!' : 'Siguiente punto óptimo'}</small></div>
                </li>`;
            });
        }

        function ordenarPorCercaniaTotal(rutaOriginal) {
            let resultado = [];
            let copiaPuntos = [...rutaOriginal];
            resultado.push(copiaPuntos.shift());

            while (copiaPuntos.length > 0) {
                let ultimoPunto = resultado[resultado.length - 1];
                let indiceMasCercano = 0;
                let distanciaMinima = Infinity;

                for (let i = 0; i < copiaPuntos.length; i++) {
                    let dist = haversine(ultimoPunto.lat, ultimoPunto.lon, copiaPuntos[i].lat, copiaPuntos[i].lon);
                    if (dist < distanciaMinima) {
                        distanciaMinima = dist;
                        indiceMasCercano = i;
                    }
                }
                resultado.push(copiaPuntos.splice(indiceMasCercano, 1)[0]);
            }
            return resultado;
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function mostrarEstado(msg, tipo) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `status ${tipo}`;
        }

        function limpiarTodo() {
            destinos = [];
            tempSeleccion = null;
            window.rutasCalculadas = { foot: null, bike: null, car: null };
            marcadoresMapa.forEach(m => map.removeLayer(m));
            marcadoresMapa = [];
            if (window.tempMarker) { map.removeLayer(window.tempMarker); window.tempMarker = null; }
            removerRutaGrafica();
            renderLista();
            document.getElementById('inputLugar').value = '';
            document.getElementById('btnAgregar').disabled = true;
            document.body.classList.remove('ver-mapa');
            obtenerUbicacionActual();
        }

        document.getElementById('inputLugar').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') buscarLugar();
        });
    </script>
